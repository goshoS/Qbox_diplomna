{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm border-0">
    <!-- ВАЖНО: Тук няма bg-white! -->
    <div class="card-header py-3 d-flex justify-content-between align-items-center">
        <div class="fw-bold"><i class="bi bi-people-fill text-primary"></i> Управление на потребители</div>

        <form class="d-flex" method="get" id="search-form">
            <input class="form-control form-control-sm me-2" type="search" name="q" id="search-input" value="{{ query|default:'' }}" placeholder="Търси потребител..." autocomplete="off">
            <button class="btn btn-sm btn-outline-primary" type="submit"><i class="bi bi-search"></i></button>
        </form>
    </div>

    <div class="card-body p-0" id="results-container">
        {% include "includes/admin_users_list.html" %}
    </div>
</div>
{% endblock %}
