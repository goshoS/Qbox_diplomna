{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 mt-3">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Редакция на отговор</h3>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">Твоят отговор</label>
                        {{ form.content }}
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'question_detail' answer.question.pk %}" class="btn btn-outline-secondary">Отказ</a>
                        <button type="submit" class="btn btn-primary px-4">Запази промените</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<style>
    textarea { width: 100%; padding: 0.5rem; border: 1px solid #ced4da; border-radius: 0.375rem; }
</style>
{% endblock %}
